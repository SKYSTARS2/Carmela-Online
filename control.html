<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم السحابية | CARMELA ONLINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-8">
    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl p-6 sm:p-8">
        <div class="flex justify-between items-center border-b pb-4 mb-6">
            <h1 class="text-2xl font-black text-slate-800"><i class="fa-solid fa-cloud-arrow-up text-pink-600 ml-2"></i> لوحة تحكم كارميلا</h1>
            <a href="index.html" target="_blank" class="bg-slate-800 text-white text-xs px-4 py-2 rounded-lg font-bold hover:bg-slate-700">عرض المتجر <i class="fa-solid fa-external-link-alt mr-1"></i></a>
        </div>

        <!-- Form -->
        <form id="productForm" class="bg-pink-50 border border-pink-100 p-5 rounded-xl mb-8 space-y-4">
            <h2 class="font-bold text-slate-800 text-lg"><i class="fa-solid fa-circle-plus text-pink-600 ml-1"></i> إضافة منتج جديد</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">اسم المنتج *</label>
                    <input type="text" id="pName" required placeholder="مثال: فستان راقي" class="w-full border rounded-lg p-2.5 text-sm bg-white focus:outline-none focus:border-pink-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">السعر (جنيه مصري) *</label>
                    <input type="number" id="pPrice" required placeholder="500" class="w-full border rounded-lg p-2.5 text-sm bg-white focus:outline-none focus:border-pink-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">القسم *</label>
                    <select id="pCategory" class="w-full border rounded-lg p-2.5 text-sm bg-white focus:outline-none focus:border-pink-600">
                        <option value="ملابس">ملابس وفساتين</option>
                        <option value="إكسسوارات">إكسسوارات</option>
                        <option value="منظفات وأدوات منزلية">منظفات وأدوات منزلية</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">الكمية بالمخزون *</label>
                    <input type="number" id="pStock" required value="3" class="w-full border rounded-lg p-2.5 text-sm bg-white focus:outline-none focus:border-pink-600">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">صورة المنتج *</label>
                <input type="file" id="pImageFile" accept="image/*" required class="w-full border rounded-lg p-2 text-sm bg-white">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-xl transition-colors shadow">
                حفظ ونشر المنتج أونلاين للجميع 🚀
            </button>
        </form>

        <!-- Current Products List -->
        <div>
            <h2 class="font-bold text-slate-800 text-lg mb-4">المنتجات الحالية على السحابة</h2>
            <div id="adminProductsList" class="space-y-3">
                <p class="text-gray-500 text-center py-4">جاري تحميل المنتجات...</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_2e4528OLsO5Y5VD-8LBfHQe6HZ3VotA",
            authDomain: "carmela-online.firebaseapp.com",
            projectId: "carmela-online",
            storageBucket: "carmela-online.firebasestorage.app",
            messagingSenderId: "336762136924",
            appId: "1:336762136924:web:56ab68226a9b3e5fcb7999",
            measurementId: "G-CD8EF175V2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadProducts() {
            const list = document.getElementById('adminProductsList');
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                let html = "";
                if (querySnapshot.empty) {
                    list.innerHTML = `<p class="text-gray-500 text-center py-4">لا توجد منتجات مسجلة حالياً.</p>`;
                    return;
                }
                
                querySnapshot.forEach((docSnap) => {
                    const p = docSnap.data();
                    html += `
                        <div class="flex items-center justify-between bg-white border p-3 rounded-xl shadow-xs">
                            <div class="flex items-center gap-3">
                                <img src="${p.image}" class="w-14 h-14 object-cover rounded-lg border" onerror="this.src='https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=100&q=80'">
                                <div>
                                    <h4 class="font-bold text-sm text-slate-800">${p.name}</h4>
                                    <p class="text-xs text-pink-600 font-bold">${p.price} ج.م | <span class="text-gray-500">${p.category}</span></p>
                                </div>
                            </div>
                            <button onclick="deleteProduct('${docSnap.id}')" class="bg-red-50 text-red-600 hover:bg-red-600 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-colors">
                                <i class="fa-solid fa-trash ml-1"></i> حذف
                            </button>
                        </div>
                    `;
                });
                list.innerHTML = html;
            } catch (err) {
                console.error(err);
                list.innerHTML = `<p class="text-red-500 text-center">خطأ في الاتصال بقاعدة البيانات: ${err.message}</p>`;
            }
        }

        window.deleteProduct = async function(id) {
            if(confirm('هل أنت متأكد من الحذف؟')) {
                try {
                    await deleteDoc(doc(db, "products", id));
                    loadProducts();
                } catch(err) {
                    alert('خطأ أثناء الحذف: ' + err.message);
                }
            }
        };

        document.getElementById('productForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'جاري الرفع... ⏳';

            const name = document.getElementById('pName').value;
            const price = parseFloat(document.getElementById('pPrice').value);
            const category = document.getElementById('pCategory').value;
            const stock = parseInt(document.getElementById('pStock').value);
            const fileInput = document.getElementById('pImageFile');

            if (!fileInput.files || fileInput.files.length === 0) {
                alert('يرجى اختيار صورة أولاً');
                btn.disabled = false;
                btn.textContent = 'حفظ ونشر المنتج أونلاين للجميع 🚀';
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(event) {
                const img = new Image();
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 400;
                    if (width > height && width > maxDim) {
                        height *= maxDim / width;
                        width = maxDim;
                    } else if (height > maxDim) {
                        width *= maxDim / height;
                        height = maxDim;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedImage = canvas.toDataURL('image/jpeg', 0.5);

                    try {
                        await addDoc(collection(db, "products"), {
                            name, price, category, stock,
                            image: compressedImage,
                            createdAt: Date.now()
                        });
                        alert('تم نشر المنتج بنجاح! 🎉');
                        document.getElementById('productForm').reset();
                        loadProducts();
                    } catch (err) {
                        console.error(err);
                        alert('فشل الرفع: ' + err.message);
                    } finally {
                        btn.disabled = false;
                        btn.textContent = 'حفظ ونشر المنتج أونلاين للجميع 🚀';
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(fileInput.files[0]);
        });

        loadProducts();
    </script>
</body>
</html>
